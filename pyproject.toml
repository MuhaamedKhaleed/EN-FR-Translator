[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "enfr-translator"
version = "0.1.0"
description = "Local-only English/French Marian translation and parallel-data checks"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = ["typer==0.15.2", "click==8.1.8", "python-dotenv==1.1.0"]

[project.optional-dependencies]
ml = ["torch==2.4.1", "transformers==4.49.0", "sentencepiece==0.2.0", "sacremoses==0.1.1", "numpy==1.26.4"]
dev = ["pytest==8.3.5", "pytest-cov==6.0.0", "ruff==0.11.2", "mypy==1.15.0", "pre-commit==4.2.0"]

[project.scripts]
enfr = "enfr_translator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/enfr_translator"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
