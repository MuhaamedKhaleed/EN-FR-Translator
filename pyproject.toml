[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enfr-translator"
version = "1.0.0"
description = "Fine-tune, evaluate and serve an English-to-French translation model (MarianMT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Khaled" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.46",
    "sentencepiece>=0.1.99",
    "sacremoses>=0.1.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
train = ["datasets>=2.14", "evaluate>=0.4", "sacrebleu>=2.3", "accelerate>=0.26"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
enfr = "enfr_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
